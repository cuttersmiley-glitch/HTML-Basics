<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zillow Clone</title>
  <link rel="stylesheet" href="zion.css">
</head>
<body>
  <header class="header">
    <h1>Find Your Dream Home</h1>
    <form class="search-bar">
      <input type="text" placeholder="Search by city, zip, or neighborhood">
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="property-list">
    <div class="property-card">
      <img src="https://via.placeholder.com/300x200" alt="Property Image">
      <div class="property-details">
        <h2>$500,000</h2>
        <p>3 Beds • 2 Baths • 1,500 sqft</p>
        <p>123 Main Street, Springfield</p>
      </div>
    </div>

    <div class="property-card">
      <img src="https://via.placeholder.com/300x200" alt="Property Image">
      <div class="property-details">
        <h2>$750,000</h2>
        <p>4 Beds • 3 Baths • 2,000 sqft</p>
        <p>456 Elm Street, Metropolis</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Zillow Clone. All Rights Reserved.</p>
  </footer>
</body>
</html>

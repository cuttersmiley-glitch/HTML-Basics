<!DOCTYPE html>
<html>
<head>
    <title>Comedy Show Survey</title>
</head>
<body>

<h2>COMEDY SHOW SURVEY</h2>

<form action="process.php" method="POST">

    Surname: <input type="text" name="surname" required>
    Other Name: <input type="text" name="othername" required><br><br>

    Gender:
    <input type="radio" name="gender" value="Male" required> Male
    <input type="radio" name="gender" value="Female"> Female
    <br><br>

    What is your favourite show?<br>
    <input type="radio" name="show" value="Naswa" required> Naswa<br>
    <input type="radio" name="show" value="Kaa Rada"> Kaa Rada<br>
    <input type="radio" name="show" value="Pasua"> Pasua<br>
    <input type="radio" name="show" value="Others"> Others<br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

    <textarea name="Address">Address</textarea>

</form>
<script>
let count = 0;
let num = 3;

while(count < 20){
    document.write(num + "<br>");
    num += 3;
    count++;
}
</script>
</body>
</html>

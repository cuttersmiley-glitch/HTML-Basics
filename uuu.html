<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Zillow</title>
  <link rel="stylesheet" href="uuu.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="logo.png" alt="Zillow Logo">
    </div>
    <input type="search" placeholder="Address, neighborhood, city..." class="search-bar">
    <button class="search-button">Search</button>
  </header>

  <section class="hero">
    <h1>Agents. Tours. Loans. Homes.</h1>
    <div class="search-box">
      <input type="text" placeholder="Address, neighborhood, city..." />
      <button>Search</button>
    </div>
  </section>

  <section class="recommendations">
    <h2>Get home recommendations</h2>
    <p>Sign in for a more personalized experience.</p>
    <button class="sign-in">Sign in</button>
    <div class="recommendation-cards">
      <div class="card">
        <p>Recommended homes</p>
        <p>Based on your monthly budget</p>
      </div>
      <div class="card">
        <p>Recommended homes</p>
        <p>Based on your preferred location</p>
      </div>
    </div>
  </section>
</body>
</html>
